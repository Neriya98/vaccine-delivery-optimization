[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vaccine_route_optimization"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "1. AKPOVI David 2. ABIMBOLA Dara 3. EGUE Jordan 4. GNANSOUNOU Cedric" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
requires-python = "~=3.11.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["vaccine_route_optimization"]
force_sort_within_sections = true


