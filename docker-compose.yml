services:

  # ── Base de données PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       flu_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Flask ────────────────────────────────────────────────────────────
  web:
    build: ./StreamVax/backend
    ports:
      - "5000:5000"       # exposé pour debug ; le frontend passe par nginx
    environment:
      FLASK_ENV:              development
      FLASK_APP:              run.py
      SECRET_KEY:             change-me-in-production
      DATABASE_URL:           postgresql://postgres:postgres@db:5432/flu_dashboard
      ML_API_BASE_URL:        ${ML_API_BASE_URL:-http://localhost:8000}
      ML_API_KEY:             ${ML_API_KEY:-}
      STOCK_LOW_THRESHOLD:    "20"
      SURGE_RISK_THRESHOLD:   "1.5"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && flask run --host=0.0.0.0"
    volumes:
      - ./StreamVax/backend:/app   # rechargement à chaud en développement

  # ── Frontend React (build + nginx) ──────────────────────────────────────────
  frontend:
    build: ./StreamVax/frontend
    ports:
      - "80:80"            # accès principal : http://localhost
    depends_on:
      - web

volumes:
  postgres_data:
